apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "384Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: mongodb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-company-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-company-os
  template:
    metadata:
      labels:
        app: ai-company-os
    spec:
      containers:
      - name: ai-company-os
        image: ai-company-os:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 4000
        resources:
          requests:
            memory: "192Mi"
            cpu: "100m"
          limits:
            memory: "400Mi"
            cpu: "500m"
        env:
        - name: PORT
          value: "4000"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=256"
        - name: MONGODB_URI
          value: "mongodb://mongodb-service:27017/hermes"
        - name: STRIPE_MODE
          value: "live"
        - name: HERMES_REQUIRE_APPROVAL
          value: "true"
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: STRIPE_SECRET_KEY
              optional: true
        - name: STRIPE_TEST_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: STRIPE_TEST_SECRET_KEY
              optional: true
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: STRIPE_WEBHOOK_SECRET
              optional: true
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: ADMIN_USERNAME
              optional: true
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: ADMIN_PASSWORD
              optional: true
        - name: ADMIN_PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: ADMIN_PASSWORD_HASH
              optional: true
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: JWT_SECRET
              optional: true
        - name: XAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: XAI_API_KEY
              optional: true
        - name: XAI_MODEL
          value: "grok-4.6"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: OPENAI_API_KEY
              optional: true
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: GEMINI_API_KEY
              optional: true
        - name: GEMINI_PRIMARY_MODEL
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: GEMINI_PRIMARY_MODEL
              optional: true
        - name: GEMINI_LIGHT_MODEL
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: GEMINI_LIGHT_MODEL
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: GROQ_API_KEY
              optional: true
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: OPENROUTER_API_KEY
              optional: true
        - name: CEREBRAS_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: CEREBRAS_API_KEY
              optional: true
        - name: MISTRAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: MISTRAL_API_KEY
              optional: true
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: DEEPSEEK_API_KEY
              optional: true
        - name: TOGETHER_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: TOGETHER_API_KEY
              optional: true
        - name: NVIDIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: NVIDIA_API_KEY
              optional: true
        - name: OPENAI_COMPAT_BASE_URL
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: OPENAI_COMPAT_BASE_URL
              optional: true
        - name: OPENAI_COMPAT_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: OPENAI_COMPAT_API_KEY
              optional: true
        - name: OPENAI_COMPAT_MODEL
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: OPENAI_COMPAT_MODEL
              optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: ai-company-os-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 4000
    nodePort: 30080
  selector:
    app: ai-company-os
